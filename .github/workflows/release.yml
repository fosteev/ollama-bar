name: Release

# Tags are cut by scripts/release.sh, which moves Project.swift and the tag in one commit.
on:
  push:
    tags: ["v*"]

# The last step points the cask at the release it just made, which means writing to the repo.
permissions:
  contents: write

jobs:
  release:
    # Xcode 26, for the toolchain reason spelled out in ci.yml.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with the project is a release nobody can reproduce: the download says
      # one version and the app's About box says another. Cheaper to refuse than to yank.
      - name: Check the tag against the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(sed -n 's/.*"MARKETING_VERSION": "\([^"]*\)".*/\1/p' Project.swift)
          if [ "$tag" != "$project" ]; then
            echo "tag $GITHUB_REF_NAME does not match MARKETING_VERSION $project" >&2
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Install Tuist
        run: brew install tuist

      # Everything below is written so a repository without the Apple secrets still cuts a release,
      # ad-hoc signed exactly as before. Fill all six in and the same tag produces a notarized
      # build instead; nothing else about the pipeline moves. See docs/TODO.md.
      - name: Look for signing material
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12 }}
        run: |
          if [ -n "$CERTIFICATE" ]; then
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "SIGNED=no" >> "$GITHUB_ENV"
            echo "::warning::No Developer ID secrets — this release will be ad-hoc signed and macOS will refuse it until the user clears the quarantine flag by hand."
          fi

      # A throwaway keychain rather than the login one: the runner is disposable, but leaving a
      # private key in a keychain that outlives the step is a habit worth not having.
      - name: Import the Developer ID certificate
        if: env.SIGNED == 'yes'
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this codesign stops for a UI prompt that nobody is there to answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"

      - name: Build Release
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          tuist generate --no-open
          signing=(CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES)
          if [ "$SIGNED" = yes ]; then
            # --timestamp is not a nicety: notarization rejects a signature without one.
            signing=(
              "CODE_SIGN_IDENTITY=Developer ID Application"
              "DEVELOPMENT_TEAM=$TEAM_ID"
              "OTHER_CODE_SIGN_FLAGS=--timestamp"
            )
          fi
          xcodebuild \
            -workspace OllamaBar.xcworkspace \
            -scheme OllamaBar \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath .build/xcode \
            "${signing[@]}" \
            build

      # Notarization takes the archive, but the ticket is stapled to the app — so this submits a
      # throwaway zip and the Archive step below packs the stapled bundle for real.
      - name: Notarize
        if: env.SIGNED == 'yes'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          app=.build/xcode/Build/Products/Release/OllamaBar.app
          codesign --verify --deep --strict --verbose=2 "$app"

          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent --sequesterRsrc "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notarize.zip"

          # Stapled, the ticket travels with the app: it opens on a machine that is offline, or
          # after Apple has moved on. Unstapled, the first launch needs the network.
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl -a -vvv -t exec "$app"

      # ditto rather than zip: it keeps the bundle's symlinks and extended attributes, and a bundle
      # that lost them is a bundle macOS refuses to launch.
      - name: Archive
        run: |
          zip="$RUNNER_TEMP/OllamaBar-$VERSION.zip"
          ditto -c -k --keepParent --sequesterRsrc \
            .build/xcode/Build/Products/Release/OllamaBar.app "$zip"
          echo "ZIP=$zip" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 "$zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ```
          brew tap fosteev/ollama-bar https://github.com/fosteev/ollama-bar
          brew trust --cask fosteev/ollama-bar/ollama-bar
          brew install --cask ollama-bar
          ```

          Homebrew 6 will not load a cask from an unofficial tap until you trust it, hence the
          third line.
          NOTES
          if [ "$SIGNED" != yes ]; then
            cat >> "$RUNNER_TEMP/notes.md" <<'NOTES'

          This build is ad-hoc signed, so macOS refuses it on first launch and offers only to move
          it to the Trash — which it will actually do. One more line, after installing:

          ```
          xattr -dr com.apple.quarantine /Applications/OllamaBar.app
          ```
          NOTES
          fi
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file "$RUNNER_TEMP/notes.md"

      # Without this the cask still points at the previous release and every upgrade needs a
      # hand-pasted checksum.
      - name: Point the cask at this release
        run: |
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" \
            Casks/ollama-bar.rb
          if git diff --quiet Casks/ollama-bar.rb; then
            echo "the cask already points at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/ollama-bar.rb
          git commit -m "Point the cask at $GITHUB_REF_NAME"
          git push origin HEAD:main

      # if: always() — a failed build must not leave the signing key sitting in a keychain that is
      # still on the search list.
      - name: Forget the signing keychain
        if: always() && env.SIGNED == 'yes'
        run: |
          security list-keychains -d user -s login.keychain-db
          security delete-keychain "$KEYCHAIN" || true
