name: CI

on:
  # Not tags: those are releases, and the release workflow runs the same tests before it builds.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Package.swift declares swift-tools-version 6.2, which needs Xcode 26. The macos-15 image
    # ships Xcode 16 and cannot even read the manifest, let alone build it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # Core and Infrastructure build and test as a plain SPM package — no Tuist, no Xcode project.
      # The proxy tests bind real loopback sockets, which a GitHub runner allows.
      - name: Test
        run: swift test
